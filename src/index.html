  <body class="page__body">
    <header class="header">
      <div class="container">
        <div class="header__container">
          <!-- Верхня частина для мобільної версії (burger + logo + image) -->
          <div class="header__top">
            <div class="header__top-content">
              <div class="header__top-burger">
                <a href="#"></a>
              </div>
              <div class="header__top-logo">
                <a href="#"></a>
              </div>
            </div>

            <img
              src="./images/main-image.png"
              alt="Museum image"
              class="header__top-image"
            />
          </div>

          <!-- Нижня частина для мобільної версії (title + button) -->
          <div class="header__bottom">
            <h1 class="header__bottom-title">Художній музей</h1>
            <button class="button header__bottom-button">
              Квитки
              <span class="button__img">
                <img
                  src="./images/icons/button-right-arrow.png"
                  alt="right arrow"
                />
              </span>
            </button>
          </div>

          <!-- Ліва сторона для desktop/tablet (burger + title + button) -->
          <div class="header__left-side">
            <div class="header__left-side-burger">
              <a href="#"></a>
            </div>
            <h1 class="header__left-side-title">Художній музей</h1>
            <button class="button header__left-side-button">
              Квитки
              <span class="button__img">
                <img
                  src="../src/images/icons/button-right-arrow.png"
                  alt="right arrow"
                />
              </span>
            </button>

            <div class="header__left-side-events">
              <div class="header__left-side-events-divider"></div>
              <span class="header__left-side-events-title">Події</span>
            </div>
          </div>

          <!-- Права сторона для desktop/tablet (logo + image) -->
          <div class="header__right-side">
            <div class="header__right-side-logo">
              <a
                href="#"
                class="header__right-side-logo-image"
              ></a>
            </div>
            <img
              src="../src/images/main-image.png"
              alt="Museum image"
              class="header__right-side-image"
            />
          </div>
        </div>
      </div>
    </header>
